version: 2
updates:
  # Python (FastAPI / Pydantic / pytest) — root, single repo-wide toolchain
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps-backend)
    groups:
      python-runtime:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "pydantic*"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "httpx"
    ignore:
      # Lockstep with FastAPI 0.115.x: block majors until coordinated upgrade.
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uvicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major"]

  # Frontend (Next.js / shadcn / Tailwind)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps-frontend)
    groups:
      next-stack:
        patterns:
          - "next"
          - "next-themes"
          - "eslint-config-next"
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tailwind-stack:
        patterns:
          - "tailwindcss"
          - "tailwind-merge"
          - "autoprefixer"
          - "postcss"
      radix-stack:
        patterns:
          - "@radix-ui/*"
          - "class-variance-authority"
          - "clsx"
          - "lucide-react"
      dev-tooling:
        patterns:
          - "eslint"
          - "typescript"
          - "@types/node"
    ignore:
      # Next 14.x lockstep: every dep below must major-bump in concert
      # with `next` itself, so block solo majors until we plan a full
      # Next 15/16 upgrade as a dedicated PR.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "autoprefixer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postcss"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(deps-actions)
