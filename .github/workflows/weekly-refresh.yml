name: weekly-refresh

# Refresh — re-validates every existing DB row by direct-fetching its
# source_url (no search APIs). Runs ONCE A WEEK (Sunday 03:00 UTC + jitter,
# 1 hour after weekly-discovery so the catalog is up-to-date).
#
# For each row: polite-fetch the landing URL, follow up to 2 internal
# links from a known set (/pricing, /free, /free-tier, /startups, …)
# if the landing lacks pricing signal, run the LLM extractor against
# the combined page text, diff against the prior row, persist changes.
#
# Output: data/snapshots/<date>.json + data/resourceos.db committed
# back to main when changes are detected. Empty-diff runs are no-ops.

on:
  schedule:
    - cron: "0 3 * * 0"  # Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      max_records:
        description: "Cap rows processed (debug; default: all)"
        type: string
        default: ""
      rate_limit_s:
        description: "Per-host rate limit seconds (default 30)"
        type: string
        default: "30"

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 51+ providers × polite fetch may take ~30 min
    env:
      MAX_RECORDS: ${{ github.event.inputs.max_records || '' }}
      RATE_LIMIT_S: ${{ github.event.inputs.rate_limit_s || '30' }}
      RESOURCEOS_DB_PATH: ${{ github.workspace }}/data/resourceos.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OMNIROUTE_API_TOKEN: ${{ secrets.OMNIROUTE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: jitter
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            sleep $(( RANDOM % 600 ))    # 0-10 min
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: install deps
        run: |
          pip install -r backend/requirements-dev.txt
          pip install -r backend/requirements-agents.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"

      - name: bootstrap OmniRoute
        env:
          # `omniroutectl env-sync` writes `.env` with DATA_DIR=/app/data
          # (containerized default) which is unwritable on Actions runners.
          # The sed step below overrides to /tmp/omniroute-data BEFORE
          # OmniRoute boots and reads `.env`. Diagnosed locally 2026-04-28.
          DATA_DIR: /tmp/omniroute-data
        run: |
          set -e
          mkdir -p "$DATA_DIR"
          omniroutectl env-sync
          sed -i 's|^DATA_DIR=.*|DATA_DIR=/tmp/omniroute-data|' .env
          npx -y omniroute@latest --version > /tmp/npx-warm.log 2>&1 || true
          nohup env DATA_DIR="$DATA_DIR" npx -y omniroute@latest --no-open --port 20128 \
            > /tmp/omniroute.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:20128/api/init >/dev/null 2>&1; then
              echo "OmniRoute reachable after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::OmniRoute did not become reachable within 5 minutes"
          tail -200 /tmp/omniroute.log || true
          exit 1

      - name: issue OmniRoute API token
        # Pre-shared OMNIROUTE_API_TOKEN secret was issued against a
        # different API_KEY_SECRET than the one env-sync auto-generates
        # each run. Issue a fresh token at runtime against THIS run's
        # OmniRoute instance. Diagnosed locally 2026-04-28.
        run: |
          set -e
          token=$(curl -sS -X POST http://localhost:20128/api/keys \
            -H 'content-type: application/json' \
            -d '{"name":"workflow-runner","scope":"read-write"}' \
            | python -c "import json,sys; print(json.load(sys.stdin)['key'])")
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Failed to issue OmniRoute API key"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "OMNIROUTE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Issued runtime OmniRoute API token (length=${#token})"

      - name: run refresh
        run: |
          ARGS="--rate-limit-s $RATE_LIMIT_S"
          if [ -n "$MAX_RECORDS" ]; then
            ARGS="$ARGS --max-records $MAX_RECORDS"
          fi
          mkdir -p data
          python -m agents.refresh_cli $ARGS

      - name: dump OmniRoute log on failure
        if: failure()
        run: |
          echo "=== /tmp/omniroute.log (last 200 lines) ==="
          tail -200 /tmp/omniroute.log 2>/dev/null || echo "(no /tmp/omniroute.log)"
          echo ""
          echo "=== /tmp/npx-warm.log ==="
          cat /tmp/npx-warm.log 2>/dev/null || echo "(no /tmp/npx-warm.log)"
          echo ""
          echo "=== probing /api/init ==="
          curl -fsSv http://localhost:20128/api/init 2>&1 | head -40 || true
          echo ""
          echo "=== sample chat completion (raw response) ==="
          curl -sS -X POST http://localhost:20128/api/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"groq/llama-3.1-8b-instant","messages":[{"role":"user","content":"ping"}],"max_tokens":4}' \
            2>&1 | head -40 || true

      - name: tear down OmniRoute
        if: always()
        run: omniroutectl down || true

      - name: commit snapshot if changed
        run: |
          git config user.name  "resourceos-bot"
          git config user.email "resourceos-bot@users.noreply.github.com"
          git add data/snapshots/*.json data/resourceos.db data/refresh_runs/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "::notice::no changes to commit"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          git commit -m "chore(refresh): weekly run ${today}"
          git push origin HEAD:main

      - name: upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: refresh-${{ github.run_id }}
          path: |
            data/refresh_runs/
            data/raw/
          if-no-files-found: ignore
          retention-days: 7
