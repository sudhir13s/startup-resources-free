name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: python lint + tests (backend + freellm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: install dev deps
        run: pip install -r backend/requirements-dev.txt
      - name: ruff
        run: ruff check backend/ freellm/ collectors/ pipeline/ agents/ schema/
      - name: pytest
        run: pytest backend/tests freellm/tests collectors/tests pipeline/tests agents/tests schema/tests -v
      - name: freellm CLI smoke
        run: |
          python -m freellm version
          python -m freellm catalog
          python -m freellm catalog --modality text
          python -m freellm keys
      - name: pipeline dry-run smoke
        run: python -m pipeline --dry-run

  build-frontend:
    name: frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        # npm ci enforces lockfile (no peer-dep "fix-ups" that broke us before).
        run: npm ci --no-audit --no-fund
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: build
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_APP_ENV: ci
        run: npm run build
