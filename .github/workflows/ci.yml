name: CI

# Manual only — run it when you want a check, it never fires on push or PR:
#   gh workflow run ci.yml --ref <branch>      (then: gh run watch)
# or GitHub → Actions → CI → "Run workflow".
on:
  workflow_dispatch:

jobs:
  python:
    name: python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install dev deps
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check domain storage freellm refresh api
      - name: pytest
        run: pytest
      - name: freellm CLI smoke
        run: |
          python -m freellm version
          python -m freellm catalog
          python -m freellm catalog --modality text
          python -m freellm keys

  build-frontend:
    name: frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        # npm ci enforces lockfile (no peer-dep "fix-ups" that broke us before).
        run: npm ci --no-audit --no-fund
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: build
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_APP_ENV: ci
        run: npm run build
