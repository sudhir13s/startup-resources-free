name: manual-full-run

# User-triggered orchestrator: runs both `weekly-discovery` AND
# `weekly-refresh` in one shot. Wired to the dashboard's "Run now"
# button (frontend/components/TopBar.tsx) so a single click in the
# browser fans out to both child workflows without the user having
# to navigate to two separate Actions pages.
#
# Why a separate workflow vs in-line both jobs:
# - Each child is heavy (OmniRoute boot, full agent stack). Keeping
#   them as independent reusable workflows means we can debug + retry
#   each independently when one fails.
# - Single dispatch URL → simpler UI in TopBar.
# - GITHUB_TOKEN with `actions: write` is enough to dispatch siblings
#   in the same repo. No PAT needed.

on:
  workflow_dispatch:
    inputs:
      max_per_category:
        description: "Max discovery candidates to keep per category (default 5)"
        type: string
        default: "5"
      categories:
        description: "Comma-separated discovery categories subset (default: all)"
        type: string
        default: ""

permissions:
  actions: write   # required to dispatch the two child workflows
  contents: read

concurrency:
  group: manual-full-run
  cancel-in-progress: false

jobs:
  fan-out:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: trigger weekly-discovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ARGS=( --ref "${{ github.ref_name }}" -f "max_per_category=${{ inputs.max_per_category }}" )
          if [ -n "${{ inputs.categories }}" ]; then
            ARGS+=( -f "categories=${{ inputs.categories }}" )
          fi
          gh workflow run weekly-discovery.yml "${ARGS[@]}"
          echo "::notice::weekly-discovery dispatched"

      - name: trigger weekly-refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh workflow run weekly-refresh.yml --ref "${{ github.ref_name }}"
          echo "::notice::weekly-refresh dispatched"

      - name: summary
        if: always()
        run: |
          {
            echo "## Manual full-run dispatched"
            echo ""
            echo "Both child workflows have been triggered. Watch their progress here:"
            echo ""
            echo "- [weekly-discovery](https://github.com/${{ github.repository }}/actions/workflows/weekly-discovery.yml)"
            echo "- [weekly-refresh](https://github.com/${{ github.repository }}/actions/workflows/weekly-refresh.yml)"
            echo ""
            echo "Discovery typically finishes in 8-15 min. Refresh in 15-30 min."
            echo "Open snapshots / candidates land via auto-PR — review + merge as usual."
          } >> "$GITHUB_STEP_SUMMARY"
