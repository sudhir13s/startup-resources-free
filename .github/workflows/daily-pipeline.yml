name: daily-pipeline

# Runs the orchestrator once per day at ~02:00 UTC + ~10 min jitter, plus
# a manual `workflow_dispatch` button so you can fire it on demand.
#
# Two modes:
#
# 1. `mode: heuristic`  (default for the scheduled cron)
#    No LLM, no OmniRoute. The polite-fetch + seed-merge path. Works
#    out of the box; commits today's snapshot if anything moved.
#
# 2. `mode: auto` / `mode: llm`
#    Requires free-provider API keys as repo secrets:
#      `GROQ_API_KEY`, `GEMINI_API_KEY`, `OPENROUTER_API_KEY`,
#      `CEREBRAS_API_KEY`, `TOGETHER_API_KEY`, `MISTRAL_API_KEY`,
#      `HF_TOKEN`, `OMNIROUTE_API_TOKEN`.
#    OmniRouteConfig is now public — pip install runs anonymously,
#    no PAT needed.
#    Use `workflow_dispatch` to switch modes without editing this file.
#
# Output: pushes back to `main` with `data/snapshots/<date>.json` (and
# `data/resourceos.db` once we move SQLite to git-tracked persistence)
# only when there are actual changes — empty-diff runs are no-ops.

on:
  schedule:
    # 02:00 UTC daily. Jitter is added in the first step.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Orchestrator mode"
        type: choice
        default: heuristic
        options: [heuristic, auto, llm]
      providers:
        description: "Comma-separated provider ids (default: all)"
        type: string
        default: ""
      rate_limit_s:
        description: "Per-host rate limit seconds (default: 30)"
        type: string
        default: "30"

permissions:
  contents: write   # commit the snapshot back to main

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    name: pipeline ${{ github.event.inputs.mode || 'heuristic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event.inputs.mode || 'heuristic' }}
      PROVIDERS: ${{ github.event.inputs.providers || '' }}
      RATE_LIMIT_S: ${{ github.event.inputs.rate_limit_s || '30' }}
      # Free-tier provider keys. Missing -> mode=auto silently downgrades
      # the affected provider to heuristic; mode=llm fails loud.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OMNIROUTE_API_TOKEN: ${{ secrets.OMNIROUTE_API_TOKEN }}
      RESOURCEOS_DB_PATH: ${{ github.workspace }}/data/resourceos.db
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: jitter
        # Spread cron load by 0-9 minutes so we don't hit every provider
        # at exactly :00 alongside everyone else's cron.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            sleep $(( RANDOM % 540 ))
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: install base deps
        run: pip install -r backend/requirements-dev.txt

      - name: install agent stack (mode=auto / mode=llm only)
        if: env.MODE != 'heuristic'
        run: pip install -r backend/requirements-agents.txt

      - uses: actions/setup-node@v6
        if: env.MODE != 'heuristic'
        with:
          node-version: "22.22.2"

      - name: bootstrap OmniRoute (mode=auto / mode=llm only)
        if: env.MODE != 'heuristic'
        run: |
          set -e
          omniroutectl env-sync

          # Pre-warm the npm cache so the actual spawn doesn't pay the
          # full omniroute@latest fetch cost while we poll for readiness.
          npx -y omniroute@latest --version > /tmp/npx-warm.log 2>&1 || true

          # Spawn detached + capture logs. nohup so the process survives
          # the step's shell exit.
          nohup npx -y omniroute@latest --no-open --port 20128 \
            > /tmp/omniroute.log 2>&1 &
          OMNI_PID=$!
          echo "OmniRoute spawned with PID $OMNI_PID"

          # Poll up to 5 min — first cold-start on a fresh runner is slow.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:20128/api/init >/dev/null 2>&1; then
              echo "OmniRoute reachable after $((i * 5))s"
              omniroutectl status || true
              exit 0
            fi
            sleep 5
          done

          echo "::error::OmniRoute did not become reachable within 5 minutes"
          echo "--- /tmp/omniroute.log ---"
          tail -200 /tmp/omniroute.log || true
          exit 1

      - name: run pipeline
        run: |
          ARGS="--mode ${MODE} --rate-limit-s ${RATE_LIMIT_S} --run-id cron-$(date -u +%Y%m%d)"
          if [ -n "$PROVIDERS" ]; then
            ARGS="$ARGS --providers $PROVIDERS"
          fi
          mkdir -p data
          python -m pipeline ${ARGS}

      - name: tear down OmniRoute
        if: always() && env.MODE != 'heuristic'
        run: omniroutectl down || true

      - name: commit snapshot if changed
        run: |
          git config user.name  "resourceos-bot"
          git config user.email "resourceos-bot@users.noreply.github.com"
          git add data/snapshots/*.json data/resourceos.db 2>/dev/null || true
          # Only commit if something actually moved.
          if git diff --staged --quiet; then
            echo "::notice::no changes to commit"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          git commit -m "chore(snapshot): pipeline run ${today} (mode=${MODE})"
          git push origin HEAD:main

      - name: upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-summary-${{ github.run_id }}
          path: |
            data/runs/*.lock
            data/raw/
            data/logs/
          if-no-files-found: ignore
          retention-days: 7
