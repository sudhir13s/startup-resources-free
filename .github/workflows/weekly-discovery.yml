name: weekly-discovery

# Discovery — finds NEW providers we don't yet track. Runs ONCE A WEEK
# (Sunday 02:00 UTC + jitter) to stay well under search-API monthly free
# tiers. Two candidate sources: (1) search-API chain across Tavily / Exa
# / Jina / Linkup / SerpAPI with `-site:` exclusions of every domain we
# already know, and (2) curated aggregator pages (e.g.
# grants.startupspeedrun.org).
#
# Output: data/discovery_candidates/<date>.json + a draft PR adding
# high-scoring URLs to collectors/catalog.yaml. The next weekly-refresh
# cycle picks them up and runs the extractor against them.
#
# Required secrets — discovery proceeds with whatever subset is set;
# missing keys silently drop their provider from the chain. If ALL are
# missing, the run logs "no search providers configured" and exits 0
# (only the aggregator hop will run).
#   TAVILY_API_KEY        (1,000 / mo free, primary)
#   EXA_API_KEY           (1,000 / mo free)
#   JINA_API_KEY          (~10M tokens / mo, heavy reserve)
#   LINKUP_API_KEY        (1,000 / mo free)
#   SERPAPI_API_KEY       (100 / mo free, last resort)
#   GROQ_API_KEY / GEMINI_API_KEY / HF_TOKEN / OMNIROUTE_API_TOKEN
#     (already configured — used by the LLM ranker step)

on:
  schedule:
    - cron: "0 2 * * 0"  # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      max_per_category:
        description: "Max candidates to keep per category (default 20)"
        type: string
        default: "20"
      categories:
        description: "Comma-separated subset (default: all)"
        type: string
        default: ""

permissions:
  contents: write       # commits the candidates JSON + catalog.yaml diff
  pull-requests: write  # opens the PR

concurrency:
  group: weekly-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAX_PER_CATEGORY: ${{ github.event.inputs.max_per_category || '20' }}
      CATEGORIES: ${{ github.event.inputs.categories || '' }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OMNIROUTE_API_TOKEN: ${{ secrets.OMNIROUTE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: jitter
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            sleep $(( RANDOM % 900 ))   # 0-15 min
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: install deps
        run: |
          pip install -r backend/requirements-dev.txt
          pip install -r backend/requirements-agents.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"

      - name: bootstrap OmniRoute (LLM ranker dependency)
        env:
          # `omniroutectl env-sync` writes `.env` with DATA_DIR=/app/data
          # (containerized default) which is unwritable on Actions runners.
          # The sed step below overrides to /tmp/omniroute-data BEFORE
          # OmniRoute boots and reads `.env`. Diagnosed locally 2026-04-28.
          DATA_DIR: /tmp/omniroute-data
        run: |
          set -e
          mkdir -p "$DATA_DIR"
          omniroutectl env-sync
          # Override the DATA_DIR=/app/data that env-sync wrote.
          sed -i 's|^DATA_DIR=.*|DATA_DIR=/tmp/omniroute-data|' .env
          npx -y omniroute@latest --version > /tmp/npx-warm.log 2>&1 || true
          nohup env DATA_DIR="$DATA_DIR" npx -y omniroute@latest --no-open --port 20128 \
            > /tmp/omniroute.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:20128/api/init >/dev/null 2>&1; then
              echo "OmniRoute reachable after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::OmniRoute did not become reachable within 5 minutes"
          tail -200 /tmp/omniroute.log || true
          exit 1

      - name: issue OmniRoute API token
        # Pre-shared OMNIROUTE_API_TOKEN secret was issued against a
        # different API_KEY_SECRET than the one env-sync auto-generates
        # each run, so it always 401's. Issue a fresh token at runtime
        # against THIS run's OmniRoute instance and override the env var
        # for the discovery step. Diagnosed locally 2026-04-28 — solo
        # /api/keys POST works without auth on a fresh boot.
        run: |
          set -e
          token=$(curl -sS -X POST http://localhost:20128/api/keys \
            -H 'content-type: application/json' \
            -d '{"name":"workflow-runner","scope":"read-write"}' \
            | python -c "import json,sys; print(json.load(sys.stdin)['key'])")
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Failed to issue OmniRoute API key"
            exit 1
          fi
          # Mask in any future log output and propagate to subsequent steps.
          echo "::add-mask::$token"
          echo "OMNIROUTE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Issued runtime OmniRoute API token (length=${#token})"

      - name: run discovery
        run: |
          ARGS="--max-per-category $MAX_PER_CATEGORY"
          if [ -n "$CATEGORIES" ]; then
            ARGS="$ARGS --categories $CATEGORIES"
          fi
          mkdir -p data/discovery_candidates
          python -m agents.discovery_cli $ARGS

      - name: dump OmniRoute log on failure
        if: failure()
        run: |
          echo "=== /tmp/omniroute.log (last 200 lines) ==="
          tail -200 /tmp/omniroute.log 2>/dev/null || echo "(no /tmp/omniroute.log)"
          echo ""
          echo "=== /tmp/npx-warm.log ==="
          cat /tmp/npx-warm.log 2>/dev/null || echo "(no /tmp/npx-warm.log)"
          echo ""
          echo "=== probing /api/init ==="
          curl -fsSv http://localhost:20128/api/init 2>&1 | head -40 || true
          echo ""
          echo "=== sample chat completion (raw response) ==="
          curl -sS -X POST http://localhost:20128/api/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"groq/llama-3.1-8b-instant","messages":[{"role":"user","content":"ping"}],"max_tokens":4}' \
            2>&1 | head -40 || true

      - name: tear down OmniRoute
        if: always()
        run: omniroutectl down || true

      - name: open PR with candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          git config user.name  "resourceos-bot"
          git config user.email "resourceos-bot@users.noreply.github.com"

          if ! git diff --quiet data/discovery_candidates/ collectors/catalog.yaml 2>/dev/null; then
            branch="discovery/${today}"
            git checkout -b "$branch"
            git add data/discovery_candidates/${today}.json collectors/catalog.yaml 2>/dev/null || true
            git commit -m "discovery: weekly candidates ${today}" || exit 0
            git push origin "$branch"
            gh pr create \
              --title "discovery: weekly candidates ${today}" \
              --body "Auto-generated by weekly-discovery.yml. Top ranked candidates per category landed in collectors/catalog.yaml. Review the JSON for full evidence; merge when satisfied. Next weekly-refresh will extract structured records." \
              --base main \
              --head "$branch" \
              --label "auto-discovery"
          else
            echo "::notice::no new candidates this run"
          fi

      - name: upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-${{ github.run_id }}
          path: |
            data/discovery_candidates/
            data/search/quotas.json
          if-no-files-found: ignore
          retention-days: 14
