# Provider URL catalog — curated list of pricing / free-tier pages.
#
# Adding a row here registers a new GenericCollector at REGISTRY load.
# The pipeline polite-fetches each URL on the next run; the LLM
# extractor (mode=auto/llm) emits a ProviderRecord per fetch.
#
# When a custom regex / API collector beats the LLM (e.g. providers
# that publish a real JSON API), keep that file under
# collectors/<category>/<slug>.py and OMIT the row from this catalog.
#
# Categories: cloud | gpu | ai-api | database | storage | auth |
#             observability | domain | startup-credit | grant |
#             accelerator | perk | oss | learning
#
# robots.txt + rate-limit are honored automatically — no per-row config.

