services:
  - type: web
    name: startup-resources-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Render's free disk is ephemeral — the DB lives under /tmp and is
      # pulled from / pushed to the R2 bucket each boot/refresh.
      - key: RESOURCEOS_DB_PATH
        value: /tmp/resourceos.db
      # No CORS_ORIGIN_HOST: the API is private end-to-end — only the
      # Next.js server calls it (server-to-server, not subject to CORS),
      # sending a key derived from RESOURCEOS_PASSWORD on every request
      # (the X-ResourceOS-Key header). The raw password itself never
      # leaves this service. Settings.cors_origins defaults to an empty
      # allow-list, so no browser origin can call this service directly.
      # Secrets — set once in the Render dashboard, never committed. Same
      # value as the frontend service's RESOURCEOS_PASSWORD below.
      - key: RESOURCEOS_PASSWORD
        sync: false
      - key: RESOURCEOS_R2_ENDPOINT
        sync: false
      - key: RESOURCEOS_R2_BUCKET
        sync: false
      - key: CF_USER_ACCESS_KEY_ID
        sync: false
      - key: CF_USER_R2_SECRET_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: LINKUP_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false

  - type: web
    name: startup-resources
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.12.2"
      # Auto-resolved from the api service host. Code prepends https://.
      - key: BACKEND_HOST
        fromService:
          type: web
          name: startup-resources-api
          property: host
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      # Site login credentials — checked by app/api/auth/login/route.ts,
      # never sent to the browser. Also the source of the X-ResourceOS-Key
      # backend header (see lib/admin.ts) and the session cookie value (see
      # lib/session.ts). Set both to enable the login page; RESOURCEOS_PASSWORD
      # must match the API service's.
      - key: RESOURCEOS_USERNAME
        sync: false
      - key: RESOURCEOS_PASSWORD
        sync: false
