services:
  - type: web
    name: startup-resources-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Render's free disk is ephemeral — the DB lives under /tmp and is
      # pulled from / pushed to the R2 bucket each boot/refresh.
      - key: RESOURCEOS_DB_PATH
        value: /tmp/resourceos.db
      # Auto-resolved from the web service host. No manual entry needed
      # after Blueprint sync. Render expands `host` to e.g.
      # "startup-resources.onrender.com" — code prepends https:// scheme.
      - key: CORS_ORIGIN_HOST
        fromService:
          type: web
          name: startup-resources
          property: host
      # Secrets — set once in the Render dashboard, never committed.
      - key: RESOURCEOS_PASSPHRASE
        sync: false
      - key: RESOURCEOS_R2_ENDPOINT
        sync: false
      - key: RESOURCEOS_R2_BUCKET
        sync: false
      - key: CF_USER_ACCESS_KEY_ID
        sync: false
      - key: CF_USER_R2_SECRET_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: LINKUP_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false

  - type: web
    name: startup-resources
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.12.2"
      # Auto-resolved from the api service host. Code prepends https://.
      - key: BACKEND_HOST
        fromService:
          type: web
          name: startup-resources-api
          property: host
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      # Server-side only (Next.js route handlers) — adds X-ResourceOS-Passphrase to
      # proxied admin calls; the browser only ever sees an httpOnly
      # session cookie after the passphrase login.
      - key: RESOURCEOS_PASSPHRASE
        sync: false
