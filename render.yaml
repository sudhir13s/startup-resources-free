services:
  - type: web
    name: startup-resources-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: startup-resources-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.12.2"
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_APP_ENV
        value: production
