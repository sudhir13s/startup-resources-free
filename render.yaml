services:
  - type: web
    name: startup-resources-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Auto-resolved from the web service host. No manual entry needed
      # after Blueprint sync. Render expands `host` to e.g.
      # "startup-resources.onrender.com" — code prepends https:// scheme.
      - key: CORS_ORIGIN_HOST
        fromService:
          type: web
          name: startup-resources
          property: host

  - type: web
    name: startup-resources
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.12.2"
      # Auto-resolved from the api service host. Code prepends https://.
      - key: BACKEND_HOST
        fromService:
          type: web
          name: startup-resources-api
          property: host
      - key: NEXT_PUBLIC_APP_ENV
        value: production
